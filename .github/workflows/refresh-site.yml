# Weekly data refresh and GitHub Pages deploy for the portfolio site (site/), in English
# (site/_site) and Turkish (site/_site/tr).
#
# Failure behaviour:
# - check_site_vars.py: stops the job (before any fetch or render) while site/_variables.yml
#   still holds placeholder or missing owner details (author_bio_tr included), or, since
#   SITE_DEPLOY names tr, while site/i18n/tr.yml still has an entry marked TODO. So a
#   placeholder byline or an untranslated Turkish string never deploys.
# - fetch_raw.py: never stops the job. A source that fails has its partial raw snapshot
#   deleted, so its tables are not rebuilt and the site keeps that source's last good
#   files from the committed site/data/ (marked stale in the manifest).
# - build_tables.py: never stops the job (each table is built on its own).
# - build_site_data.py: the gate. It fails when a core output (monthly prices, price range,
#   headline stats) cannot be rebuilt (or its row count drops more than 10%) or validation
#   finds a problem; the job stops and the site already online stays as it was.
# - check_countries.py: never stops the job (Ruling F1). An export destination in the
#   refreshed data without a country.* entry (a new or renamed UN Comtrade partner) is a
#   ::warning:: and a job-summary line; the Turkish pages show its English name meanwhile.
# - Everything after that (workbooks, tests, render, rendered-site tests and link check,
#   commit) also stops the job.
# Only the default branch commits data and deploys; a run on another ref only builds.

name: Refresh and deploy site

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

concurrency: refresh-site

# Nothing by default; each job asks for what it needs.
permissions: {}

defaults:
  run:
    shell: bash # bash -eo pipefail

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  # The languages this workflow deploys. Naming tr makes hazelnut.site.i18n.deploy_problems
  # fail on a TODO left in tr.yml (check_site_vars.py and tests/site/test_i18n.py).
  SITE_DEPLOY: "en,tr"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the site/data bot commit
      pages: read # configure-pages reads the Pages settings (GET /repos/{owner}/{repo}/pages)
    timeout-minutes: 120 # the fetch alone takes tens of minutes (rate-limited APIs)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Install site requirements (no torch / chronos)
        run: pip install -r requirements-site.txt && pip install -e .

      - name: Check owner details and Turkish strings (no placeholder or TODO goes live)
        run: python scripts/check_site_vars.py

      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.11.9 # pinned in site/README.md

      - name: Fetch raw data
        run: |
          python scripts/fetch_raw.py 2>&1 | tee "$RUNNER_TEMP/fetch.log" || echo "some sources failed"
          failed=$(sed -n 's/^failed sources: //p' "$RUNNER_TEMP/fetch.log" | tr -d ',')
          # fetch_raw.py source name -> data/raw/ folder it writes
          declare -A RAW=([ordu]=ordu_sheet [tobb]=tobb [giresun]=giresun [comtrade]=comtrade
                          [faostat]=faostat [weather]=open_meteo [fx]=ecb_fx [cpi]=oecd_cpi)
          for s in $failed; do
            # Drop the partial snapshot so a half-fetched source is not published as fresh.
            rm -rf "data/raw/${RAW[$s]:-$s}"
            echo "::warning::fetch failed for $s; its site data keeps the last good copy"
          done
          {
            echo "### Fetch"
            echo
            if [ -n "$failed" ]; then echo "Failed sources: ${failed}"; else echo "All sources fetched."; fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build interim tables
        run: python scripts/build_tables.py

      - name: Build site data (gate; writes the run summary)
        run: python scripts/build_site_data.py

      # Warning only (Ruling F1): see the header. Locally the country-coverage test fails
      # instead; here it is deselected from both pytest steps below.
      - name: Untranslated export destinations (warning only)
        continue-on-error: true
        run: python scripts/check_countries.py

      - name: Build workbooks (English and Turkish)
        run: python scripts/build_workbook.py

      # The rendered-site tests skip here (no site/_site yet); they run after the render.
      # The country-coverage test is a development gate: on refreshed Comtrade data a new or
      # renamed partner would block the deploy of both languages for a missing Turkish name,
      # so it is left out here and check_countries.py warns instead (Ruling F1).
      - name: Site tests
        run: |
          pytest tests/site tests/test_fetch_raw.py -q \n            --deselect tests/site/test_i18n.py::test_every_destination_in_the_site_data_has_a_country_entry

      - name: Render site (English, then Turkish into site/_site/tr)
        run: |
          QUARTO_PYTHON="$(command -v python)"
          export QUARTO_PYTHON
          python scripts/render_site.py

      # Now the rendered-tree tests run instead of skipping: both trees pair up, hreflang,
      # Turkish text, workbooks per language, and the link check (every internal link and
      # language-switch target resolves; Turkish pages stay inside tr/). The English text
      # snapshot is a development gate fixed to the committed data, so it is left out on
      # refreshed data, and so is the country-coverage test (see "Site tests"). The Turkish
      # text test lets through the English names check_countries.py warned about.
      # The tree check comes first: without it, a missing tree would make its tests skip
      # and the step pass.
      - name: Rendered-site tests and link check (both trees)
        run: |
          for page in site/_site/index.html site/_site/tr/index.html; do
            if [ ! -f "$page" ]; then
              echo "::error::$page is missing: render_site.py did not render both language trees"
              exit 1
            fi
          done
          pytest tests/site -q -rs \
            --deselect tests/site/test_rendered_text.py::test_rendered_english_text_matches_the_snapshot \n            --deselect tests/site/test_i18n.py::test_every_destination_in_the_site_data_has_a_country_entry

      - name: Commit refreshed site data
        if: github.ref == 'refs/heads/main'
        run: |
          git add -- site/data
          if git diff --cached --quiet -- site/data; then
            echo "site/data unchanged; nothing to commit"
            exit 0
          fi
          as_of=$(python - <<'EOF'
          import json
          from pathlib import Path
          paths = sorted(Path("site/data").glob("*/manifest.json"))
          print(", ".join(sorted({json.loads(p.read_text(encoding="utf-8"))["as_of"] for p in paths})))
          EOF
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh site data (${as_of})"
          git push origin "HEAD:${GITHUB_REF_NAME}" || {
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          }

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
