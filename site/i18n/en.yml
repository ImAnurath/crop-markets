  # Labels the hazelnut analysis pages pass to their charts (legends, axis titles).
  chart:
    frost_days: "Frost days"
    shelled_exports: "Shelled exports"
    giresun_in_shell: "Giresun in-shell"
    calm_months: "Calm months"
    lira_crises: "Lira crises"
  # The hazelnut dashboard's price panel: its title, and the shocks its subtitle names
  # (keyed by the first year of a SHOCK_PERIODS entry).
  dashboard:
    price_title: "Giresun in-shell price"
    shock:
      y2014: "the 2014 frost"
      y2025: "the 2025 short crop"
  timing_note: "A harvest's crop estimate is used only from August of that year, when it is normally out; moving every estimate a month later changed the error ratios by at most 0.03, so the rule shows no sign of a leak."
  # The hazelnut analysis pages' own prose (site/hazelnut/analyses/*.qmd). Each page's
  # key is its slug with "_" for "-"; title and summary are its card on the analyses list.
  # Fields in {} are filled by the page; {fob}, {skill}, {pinball}, {mape}, {dm} and
  # {csv} are links.
  analyses:
    seasonality:
      title: "Seasonality"
      summary: "Does the price follow the harvest calendar? A little, and less than you might think."
      h1: "Does the price follow the harvest calendar?"
      found: "The price does follow the season, but only just. Averaged over {seasons} seasons it is lowest in {low_month} ({low} from the season's mean) and highest in {high_month} ({high}). One season's own ups and downs are far bigger: in a typical month the middle half of seasons spans {spread} points, so the calendar alone is a weak guide to next month's price."
      found_fallback: "The price follows the harvest calendar only weakly; the chart below shows the average month against its season's mean."
      panel_title: "Average price by month of the season"
      panel_fallback: "Each month's price as a change from its season's mean."
      foot: "Giresun exchange monthly average, USD per kg. Seasons run September to August; only complete seasons are counted. Bars: the average across seasons; whiskers: the middle half of seasons."
      local_note: "In {local} the averages run from {low} to {high}, because the currency's slide lifts prices through every season."
    exports:
      title: "Exports"
      summary: "Where the shelled nuts go, how that has shifted, and what a kilo of kernels earns."
      h1: "Where the hazelnuts go"
      found_top: "{who} took {share} of shelled export volume in {year}."
      found_lead: "{lead}'s share has gone from {lead_first} in {first} to {lead_last}."
      found_lead_second: "{lead}'s share has gone from {lead_first} in {first} to {lead_last}, while {second}'s went from {second_first} to {second_last}."
      found_ratio: "A kilo of shelled nuts has sold abroad for about {ratio} times the exchange's in-shell price, roughly the two kilos of nuts in shell it takes to make one."
      found_fallback: "Export destinations and unit values, from UN Comtrade."
      destinations_title: "Destinations over time"
      destinations_fallback: "Each destination's share of shelled export volume, by year."
      share_what: "shelled export volume"
      destinations_foot: "Share of shelled export volume (net weight) by calendar year, for the {n} largest destinations of {year}; complete years only, the rest went elsewhere. Source: UN Comtrade."
      unit_value_title: "What a kilo of kernels earns"
      unit_value_fallback: "Export value per kilo against the exchange price."
      ratio_a: "A kilo of shelled exports"
      ratio_b: "the exchange's in-shell price"
      unit_value_foot: "Shelled exports: {fob} value divided by net weight, all destinations (UN Comtrade). Giresun in-shell: the exchange's monthly average. Shelling roughly halves the weight, which accounts for most of the gap; in-shell exports are too small to compare."
    crop_and_frost:
      title: "Crop and frost"
      summary: "Bigger crops, lower prices, and how much a count of spring frost days explains."
      h1: "Bigger crop, lower price? And what frost does"
      found_frost_years: "Two frost years carry much of that: {note}"
      found_frost_count: "A plain count of spring frost days says less: {note}"
      found_fallback: "Crop size against price, and spring frost against crop size."
      crop_title: "Crop size against the season's price"
      frost_years_note: "The {first} and {second} frost years carry much of this link: {note}"
      frost_title: "Spring frost days against the crop"
      frost_fallback: "March-April frost days against the crop estimate."
      frost_caveat: "A count of cold days does not say how hard or when the frost hit; one bad night at flowering can do the damage."
      frost_days_note: "Frost days: March-April days below 0 °C, averaged over the growing-area weather points (Open-Meteo)."
      left_out: "{note} It is left out here."
    exchanges:
      title: "Giresun and Ordu"
      summary: "Two exchanges, one market: how far apart their prices run."
      h1: "Two exchanges, one market: {ref} against {other}"
      found: "{other}'s price has run below {ref}'s in most months: a median {pct} lower over {n} months, and higher in only {higher}. Over the years the two lines rise and fall together, so either exchange tells the same story about the market, at a different level."
      found_fallback: "The {ref} and {other} exchanges' prices, side by side."
      both_title: "{ref} and {other} prices"
      both_fallback: "Monthly prices on the two exchanges."
      both_foot: "USD per kg, in-shell. {ref}: the exchange's monthly average. {other}: the monthly average of the exchange's daily price sheet, converted at {ref}'s monthly rate, so it has no USD value past {ref}'s latest month. The gap is measured in {local}, which both exchanges quote."
      gap_title: "How far {other} sits from {ref}"
      gap_fallback: "{other}'s price as a change from {ref}'s."
      gap_foot: "{other}'s monthly price divided by {ref}'s, minus one, in {local}. {other}'s sheet agrees closely with TOBB's {other} Levant series on the days both report a price. {ref}-quality nuts usually fetch a premium over Levant, which may explain much of the gap."
    forecasting:
      title: "Forecasting"
      summary: "Every method we tried against \"the price stays where it is\", and an honest range."
      h1: "Can anything beat \"the price stays where it is\"?"
      found_none_beat: "Nothing we tried beat naive, the forecast that next month's price is this month's, at 1, 3 or 6 months ahead in the development period."
      found_holdout_none: "On the holdout (scored once, never tuned on) no method beat it at every horizon."
      found_shocks: "In supply shocks the errors grew {low} to {high} times, naive's included."
      found_band: "What can honestly be offered is a range: the spread of past moves gave an 8-in-10 range that held {pct} of the time {horizon} months ahead."
      found_fallback: "How the forecasting methods scored against naive."
      ratio_head: "Error ÷ naive's"
      dev_title: "Development period: error against naive"
      dev_fallback: "Each method's error divided by naive's."
      dev_caption: "Development-period error divided by naive's, by months ahead"
      dev_foot: "Mean absolute error divided by naive's on the same forecasts; above 1 is worse. {count} monthly forecasts per horizon. Naive's own error: {errors} per kg at {horizons} months."
      shocks_title: "Calm months against shock months"
      shocks_fallback: "Error divided by naive's, in calm and shock months."
      calm_head: "Calm months"
      shock_head: "Shock months"
      shocks_caption: "Error divided by naive's in calm and shock months, by months ahead"
      shocks_foot: "Shock periods by target month: {years}. Each period is scored against naive on its own months. The season regression is left out of the error multiple above: its errors are already large in calm months."
      f3_title: "{horizon} months ahead: forecasts against the price"
      f3_fallback: "Naive and the closest challenger against the actual price."
      f3_foot: "Development period, target months {first} to {last}, USD per kg. {other} is the method other than naive with the lowest {horizon}-month error. Both forecasts trail the turns. Shaded: supply shocks."
      holdout_title: "Holdout: scored once, never tuned on"
      holdout_fallback: "The final holdout, scored once."
      holdout_caption: "Holdout error divided by naive's, scored once, never tuned on"
      holdout_spike: "Many of these months fall in the 2025 price spike, so one or two big misses move every number: read it as a sanity check, not a new ranking."
      check_title: "Crop estimates: national instead of Giresun, and a month later"
      check_fallback: "Error divided by naive's with other crop inputs."
      check_rule: "the August rule"
      check_caption: "Error divided by naive's with the crop estimate on time and a month late"
      check_row_head: "Method and crop input"
      check_foot: "Development period. \"On time\" is the standard rule: a year's crop estimate is used from August of that year. \"A month late\" uses every estimate one month later (the 2018 Giresun estimate from November), to test that rule for a leak; the national rows use that late timing too, so they are not the report's main comparison. At the standard timing, the crop-estimate report found the national estimate worse than Giresun's at every method and horizon."
      band_title: "The 8-in-10 range, {horizon} months ahead"
      band_fallback: "The backtest's 8-in-10 range against the actual price."
      band_foot: "{method}: the price {horizon} months earlier times the 10th and 90th percentiles of all earlier {horizon}-month moves. Development period, USD per kg; marked months fell outside the range."
      ranges_title: "Range methods compared"
      ranges_fallback: "Coverage, width and skill of each range method."
      held80_head: "8 in 10 held"
      held90_head: "9 in 10 held"
      width_head: "8-in-10 width"
      skill_head: "Skill"
      ranges_caption: "Range forecasts: coverage, width and skill by months ahead"
      skill_link: "Skill"
      pinball_link: "pinball loss"
      ranges_foot: "Held: share of months the actual price fell inside the range. Width: the average 8-in-10 range, USD per kg. {skill}: 1 minus the method's {pinball} (averaged over five quantiles) divided by the first row's; above 0 would beat it. Development period."
      lira_split_title: "Last USD price × the lira's depreciation trend"
      lira_split_fallback: "Error divided by TL naive's, crisis and calm months."
      lira_split_foot: "{mape} divided by TL naive's, development period (36-month trend). Lira crises: {periods}. This is the lira's own depreciation trend, in the 2018-24 crisis years, suggestive (6 variants tried); it is no hazelnut-market signal."
      lira_title: "TL forecasts against TL naive"
      lira_fallback: "Error divided by TL naive's, all months."
      # lira.tail_* {trend} and {caveat}.
      lira_trend_words: "the depreciation-trend forecasts"
      lira_caveat: "suggestive ({n} variants tried)"
      mape_head: "MAPE ÷ naive's"
      mae_head: "MAE ÷ naive's"
      lira_caption: "TL forecasts: error divided by TL naive's, all months"
      dm_link: "Diebold-Mariano test"
      lira_foot: "Development period, all months. MAPE is the fair measure here; MAE is dominated by the high-inflation years. {dm} on |log error| against TL naive, all months: {p_note} Six FX variants were tried, so treat p = 0.01 as suggestive, not conclusive; p-values for the calm or crisis months alone would be approximate (their months are not consecutive) and are not shown. The sixth variant, spot plus 12-month drift, is in {csv}."
      # The lira methods whose p-values the foot gives (lira.p_part {name}).
      lira_trend:
        composed_fx_drift_36: "FX drift, 36 m"
        composed_fx_infl: "inflation rule"
      # The rows of the lira table.
      lira_method:
        naive: "TL naive"
        try_drift_36: "TL drift, 36 m"
        try_drift_12: "TL drift, 12 m"
        composed_fx_drift_36: "USD naive × FX drift, 36 m"
        composed_fx_drift_12: "USD naive × FX drift, 12 m"
        composed_fx_infl: "USD naive × inflation gap"
        composed_fx_spot: "USD naive × FX spot"
        composed_fx_spot_drift_36: "USD naive × spot + drift, 36 m"
        try_sarima: "SARIMA on TL"
        try_lightgbm: "LightGBM on TL"

