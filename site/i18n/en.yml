  split_above: "In the {crisis} months its error was {pct} above naive's; in {calm} months it was within {within} of naive's."
  split_above_range: "In the {crisis} months its error was {low} to {high} above naive's; in {calm} months it was within {within} of naive's."
  split_mixed: "In the {crisis} months its error was between {low} below and {high} above naive's; in {calm} months it was within {within} of naive's."
  period:
    calm: "calm"
    crisis: "crisis"
  p_part: "{name}: p = {ps} at {horizons} months"
  lead_none: "In percent terms nothing beat naive at {span}"
  lead_some: "In percent terms {beat} of {total} methods beat naive at {span}"
  tail_lower: "at {horizons} months {trend} had {pct} lower error, {caveat}"
  tail_lower_range: "at {horizons} months {trend} had {low} to {high} lower error, {caveat}"
  tail_mixed: "at {horizons} months {trend} had between {low} higher and {high} lower error, {caveat}"
  tail_higher: "at {horizons} months {trend} had {low} to {high} higher error"
  default_caveat: "which is suggestive only"

explorer:
  outlier_one: "{months}: {name}'s price was more than {limit} away from {ref}'s, most likely an entry error in the source. It is shown as published."
  outlier_many: "{months}: {name}'s price was more than {limit} away from {ref}'s, most likely entry errors in the source. They are shown as published."
