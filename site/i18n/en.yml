# English strings for text the Python layer builds (hazelnut.site.i18n.t).
#
# Templates are whole sentences with named {fields}; never join fragments in code.
# tr.yml has exactly the same keys and the same {fields} in each (tests/site/test_i18n.py).
# Plotly placeholders such as %{y:.2f} or %{x} pass through untouched.
# Crop-specific strings sit under the crop's slug (crop.hazelnut, hazelnut.*).

na: "n/a"

format:
  decimal: "."
  thousands: ","
  usd: "${value}"
  pct: "{value}%"
  pct_signed: "{sign}{value}%"
  # The sign of a negative percent written without an explicit sign (fmt_pct, signed=False).
  # English keeps the hyphen its pages have always shown; signed percents use "−".
  pct_minus: "-"
  month_year: "{month} {year}"
  day_month_year: "{day} {month} {year}"

month:
  1: "January"
  2: "February"
  3: "March"
  4: "April"
  5: "May"
  6: "June"
  7: "July"
  8: "August"
  9: "September"
  10: "October"
  11: "November"
  12: "December"

month_short:
  1: "Jan"
  2: "Feb"
  3: "Mar"
  4: "Apr"
  5: "May"
  6: "Jun"
  7: "Jul"
  8: "Aug"
  9: "Sep"
  10: "Oct"
  11: "Nov"
  12: "Dec"

list:
  and: "{names} and {last}"

span:
  # "May to December 2018": first month's name, then the last month with its year.
  same_year: "{first} to {last}"
  # "September 2021 to December 2023"
  years: "{first} to {last}"
  # "5 to 9" forecasts, "82% to 84%"
  values: "{low} to {high}"
  only: "{month} only"

count_word:
  2: "two"
  3: "three"
  4: "four"
  5: "five"

unit:
  usd: "USD"
  tonnes: "t"
  per_kg: "/kg"
  local_per_kg: "{unit}/kg"
  mo: "{n} mo"
  kb: "{n} KB"
  mb: "{n} MB"
  months:
    one: "{n} month"
    other: "{n} months"

stamp:
  fresh: "Data as of {month} · refreshed weekly"
  stale_from: "Data as of {month} · refreshed weekly (some sources from {oldest})"
  stale_from_some_unavailable: "Data as of {month} · refreshed weekly (some sources from {oldest}, some unavailable)"
  stale_unavailable: "Data as of {month} · refreshed weekly (some sources unavailable)"

crop:
  hazelnut:
    name: "Hazelnut"
    country: "Turkey"

overview:
  eyebrow: "Crops / {crop} / {exchanges}"
  market_eyebrow: "The market this month"

home:
