    hover: "%{y}<br>{share} of exports<br>%{customdata[0]:,.0f} t · $%{customdata[1]:,.0f}m<extra></extra>"
  crop:
    hover: "%{text}<br>%{x:,.0f} t crop<br>$%{y:.2f} /kg season average<extra></extra>"
    earlier: "Earlier seasons"
    season_average: "Season average"
  season:
    average_month: "Average month"
    # {mean}, {low}, {high}: signed percents, filled in by the chart code (as {share} above).
    hover: "%{customdata[0]}<br>average {mean}<br>middle half of seasons {low} to {high}<extra></extra>"
    middle_half: "Middle half of seasons"
  compare_hover: "{name} $%{y:,.2f} /kg<extra></extra>"
  usd_hover: "{name} $%{y:.2f}<extra></extra>"
  gap: "Gap"
  median: "Median {value}"
  highlighted: "Highlighted"
  other_years: "Other years"
  actual: "Actual"
  band:
    low: "Range low"
    range: "8-in-10 range"
    range_hover: "range $%{customdata:.2f} to $%{y:.2f}<extra></extra>"
    actual_hover: "actual $%{y:.2f}<extra></extra>"
    outside: "Outside the range"

