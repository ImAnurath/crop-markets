season:
  to_date_note: "{season} is season to date ({span}), so its average is provisional."
  to_date_label: "{season} to date"

crop_price:
  words:
    strong_negative: "bigger crops have usually come with lower prices"
    weak_negative: "bigger crops have loosely gone with lower prices"
    none: "crop size alone says little about the price"
    positive: "bigger crops have not come with lower prices"
  subtitle:
    strong_negative: "Over {n} seasons, bigger crops have usually come with lower prices (correlation {r})."
    weak_negative: "Over {n} seasons, bigger crops have loosely gone with lower prices (correlation {r})."
    none: "Over {n} seasons, crop size alone says little about the price (correlation {r})."
    positive: "Over {n} seasons, bigger crops have not come with lower prices (correlation {r})."
  fallback: "Crop estimate against the season's average price."

scoreboard:
  subtitle_none: "Each method's error divided by naive's (the price stays where it is): above 1 is worse. None beat naive at any horizon."
  subtitle_some: "Each method's error divided by naive's (the price stays where it is): above 1 is worse. {under} of {total} method-horizon scores came in under 1; the forecasting analysis tests whether that is more than chance."
  holdout_winners: "Holdout (scored once, never tuned on): {names} came in under naive at every horizon."
  holdout_none: "Holdout (scored once, never tuned on): no method beat naive at every horizon."
  foot: "Ratio of mean absolute errors, over {count} forecasts per horizon."
  analysis_link: "Forecasting analysis"
  caption: "Forecast error relative to naive, by months ahead"

analyses:
  nav_label: "Analyses"
  eyebrow: "Crops / {crop} / {analyses} / {page}"
  found: "What we found"

seasonality:
  subtitle: "Across {seasons} complete seasons, the average month sits between {low} ({low_month}) and {high} ({high_month}) from its season's mean; the middle half of seasons spans {spread} points in a typical month."

gap:
  median_below: "{name}'s monthly price ran a median {pct} below {ref}'s over {n} months"
  median_above: "{name}'s monthly price ran a median {pct} above {ref}'s over {n} months"
  band_below: "8 in 10 months fell between {low} and {high} below"
  band_above: "8 in 10 months fell between {low} and {high} above"
  band_mixed: "8 in 10 months fell between {low} below and {high} above"
  outlier_note: "Left out: {months}, when {name}'s average was more than {limit} away from {ref}'s (most likely entry errors in the source)."
  detail_discount: "{name} was dearer in {dearer} of {n} months; its widest discount was {pct}, in {month}."
  detail_premium: "{name} was dearer in {dearer} of {n} months; its widest premium was {pct}, in {month}."

frost:
  words:
    strong_negative: "more frost days have usually meant smaller crops"
    weak_negative: "more frost days have loosely gone with smaller crops"
    none: "the frost-day count says little about the crop"
    positive: "more frost days have not meant smaller crops"
  subtitle:
    strong_negative: "Over {n} years, more frost days have usually meant smaller crops (correlation {r})."
    weak_negative: "Over {n} years, more frost days have loosely gone with smaller crops (correlation {r})."
    none: "Over {n} years, the frost-day count says little about the crop (correlation {r})."
    positive: "Over {n} years, more frost days have not meant smaller crops (correlation {r})."
  fallback: "Spring frost days against the {source} crop estimate."
  fallback_no_source: "Spring frost days against the crop estimate."
  without_note: "Without {years}, the correlation is {r} ({n} seasons)."
  smallest_one: "The smallest crop, {years}, followed {days} frost days."
  smallest_many: "The {count} smallest crops, {years}, followed {days} frost days."
  partial_year: "{year} is partial: the data was built on {date}, before its frost window ended."

forecast:
  dev_some: "{under} of {total} method-horizon scores came in under 1 (below 1 beats naive), which could be chance."
  dev_none: "None beat naive at any horizon; the closest lost by {margin}."
  shock_none: "In shock months the errors were {low} to {high} times their calm size, naive's included; no method beat naive there."
  shock_some: "In shock months the errors were {low} to {high} times their calm size, naive's included; {under} of {total} shock-month scores came in under 1, by at most {best}."
  holdout_winners: "{n} forecasts per horizon, scored once, never tuned on. {names} came in under naive at every horizon; on {n} forecasts per horizon that could be chance (no significance test was run on the holdout)."
  holdout_none: "{n} forecasts per horizon, scored once, never tuned on. No method beat naive at any horizon."
  holdout_some: "{n} forecasts per horizon, scored once, never tuned on. No method beat naive at every horizon; {under} of {total} scores came in under 1."
  holdout_some_lost: "{n} forecasts per horizon, scored once, never tuned on. No method beat naive at every horizon; {under} of {total} scores came in under 1, each from a method that lost at another horizon."
  holdout_luck_note: "Each score that beat naive in the holdout had lost to naive at that same horizon in development, so these wins look like luck, not skill."
  holdout_no_repeat_note: "None of the holdout scores that beat naive also beat it in development at the same horizon."
  holdout_repeat_note: "{n} of the holdout scores that beat naive also beat it in development at the same horizon."
  f3_more: "{horizon} months ahead, naive missed by {miss}/kg on average; {name}, the closest challenger, missed by {pct} more."
  f3_less: "{horizon} months ahead, naive missed by {miss}/kg on average; {name}, the closest challenger, missed by {pct} less."
  band_all_held: "{horizon} months ahead, the 8-in-10 range held {pct} of the time ({held} of {n} months)."
  band_misses: "{horizon} months ahead, the 8-in-10 range held {pct} of the time ({held} of {n} months); {in_shock} of the {misses} misses fell in a shock period."
  ranges_none: "An honest 8-in-10 range holds about 80% of the time. {method} held {held}, and no other method scored better at any horizon."
  ranges_some: "An honest 8-in-10 range holds about 80% of the time. {method} held {held}, and {better} of {total} other scores beat it."

crop_check:
  row_on_time: "{method}, {source}, on time"
  row_late: "{method}, {source}, a month late"
  default_rule: "the timing rule"
  no_leak: "Moving every crop estimate a month later changed the scores by at most {shift}, so {rule} shows no sign of a leak; at that month-late timing the {sources} estimate scored worse in {worse} of {total} method-horizon pairs."
  leak: "Moving every crop estimate a month later changed the scores by up to {shift}, so results under {rule} may have gained from a leak; at that month-late timing the {sources} estimate scored worse in {worse} of {total} method-horizon pairs."

crop_source:
  # A crop-estimate source key in the results (crop_check.csv), in words; the forecasting
  # page shows it in a sentence and, first letter raised, in the check table. A key
  # without an entry ("giresun") is shown as it is.
  national: "national"

lira:
  split_below: "In the {crisis} months its error was {pct} below naive's; in {calm} months it was within {within} of naive's."
