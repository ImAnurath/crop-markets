    middle: "Middle"
    middle_hover: "%{x}<br>middle $%{y:.2f}<extra></extra>"
    todays_price: "Today's price"
    today: "Today"
    today_hover: "%{x}<br>today $%{y:.2f}<extra></extra>"
    tick: "+{n} mo"
  # d3 number format of tonne axes: "~s" writes 650k, ",.0f" writes 650,000 in full.
  tonnes_tickformat: "~s"
  exports:
    # {share}: the destination's share of exports, filled in by the chart code (Plotly
