  window:
    y5: "5y"
    y10: "10y"
    all: "All"
  price:
    usd_hover: "$%{y:.2f} /kg<extra></extra>"
    local_hover: "%{y:,.2f} {unit}/kg<extra></extra>"
  range:
    band_hover: "%{x}<br>$%{y:.2f}<extra>%{meta}</extra>"
    nine_in_ten: "9 in 10"
