# Turkish strings for text the Python layer builds (hazelnut.site.i18n.t).
#
# Same keys and the same {fields} as en.yml (tests/site/test_i18n.py). An entry still
# waiting for translation is the literal "TODO": the Turkish build shows the English
# text there, and a deploy that includes Turkish (SITE_DEPLOY=en,tr) fails on it.
# The owner reviews all Turkish before deploy. Terms follow site/i18n/glossary.md.
#
# Suffixes: a {field} never takes a Turkish case suffix here. Names are carried by a
# noun ("{name} borsasının", "{partner} pazarının"), years by "yılında", counts by
# "tanesi", so no apostrophe-and-vowel-harmony form has to be guessed in code.
# Sentences do not start with a field that may be lower case ({crop}, {crisis}).

