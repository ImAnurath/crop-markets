project:
  type: website
  output-dir: _site
  # Only .qmd files are pages; README.md and assets/CREDITS.md are notes, not pages.
  render:
    - "*.qmd"
    - "**/*.qmd"
  # Copied into _site as-is: the explorer reads the CSVs client-side and the
  # Downloads page and nav button link the workbook (built by scripts/build_workbook.py).
  # The leading "/" anchors each glob at site/; unanchored, the Turkish render (which
  # writes into _site/tr) would also copy the English _site/data etc. into _site/tr/_site.
  resources:
    - "/data/**"
    - "/downloads/*.xlsx"
    - "/assets/**"

# One source, two renders: _quarto-en.yml (the default) and _quarto-tr.yml hold what
# differs per language. Render both with scripts/render_site.py (English first: a full
# English render empties _site, including _site/tr).
profile:
  default: en

website:
  title: "Crop Markets"
  site-url: https://imanurath.github.io/crop-markets/
  favicon: assets/favicon.svg
  page-navigation: false
  search: false
  # The navbar items and the footer are per language, in the profile files (a profile's
  # list is appended to this file's, so the items cannot live here too).
  navbar:
    pinned: true

format:
  html:
    # Dark is listed first, so it is the default; a visitor's stored choice wins.
    theme:
      dark: [theme/tokens.scss, theme/dark.scss]
      light: [theme/tokens.scss, theme/light.scss]
    page-layout: custom
    filters:
      - filters/main-landmark.lua   # one <main> landmark per page (custom layout has none)
      - filters/lang-meta.lua       # title-tr / description-tr on the Turkish profile
      - filters/lang-links.lua      # hreflang links, first-visit detection, site.js strings
    toc: false
    code-copy: false   # no code is shown; empty OJS cells otherwise carry a stray copy button
    anchor-sections: false
    smooth-scroll: false
    link-external-newwindow: false
    include-in-header:
      - text: |
          <script>
          /* Keep Quarto's colour-scheme script working where storage is blocked
             (it reads localStorage unguarded): swap in an in-memory store. */
          (function () {
            try { var s = window.localStorage, k = "__probe"; s.setItem(k, k); s.removeItem(k); }
            catch (e) {
              var m = {};
              try {
                Object.defineProperty(window, "localStorage", { configurable: true, value: {
                  getItem: function (k) { return Object.prototype.hasOwnProperty.call(m, k) ? m[k] : null; },
                  setItem: function (k, v) { m[k] = String(v); },
                  removeItem: function (k) { delete m[k]; }
                } });
              } catch (e2) {}
            }
          })();
          </script>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
    include-before-body:
      - assets/icons.svg
    include-after-body:
      # Quarto rewrites this root path to a page-relative one (and to the site path on 404.html).
      - text: <script src="/assets/site.js"></script>

# Each language's site root, the first being the default (x-default) language: the same
# URLs as each profile's website.site-url (tests/site/test_site_trees.py keeps them in
# step). filters/lang-links.lua builds every page's hreflang links from them.
site-langs:
  - lang: en
    url: https://imanurath.github.io/crop-markets/
  - lang: tr
    url: https://imanurath.github.io/crop-markets/tr/

execute:
  echo: false
  warning: false

jupyter: python3
